name: 构建调试 APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # libsignal vendored 锚点，与 crates/core/Cargo.toml 注释一致（HEAD 哈希即信任锚）
  LIBSIGNAL_REV: eb7864c4d15435ee33681ce828930d9a4296f155
  # third_party/iroh 与 third_party/iroh-relay 的版本（本地 vendored 副本同源，
  # 与 Cargo.lock 对应）；CI 从 crates.io 取同版本发布包源码
  IROH_VERSION: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ================= Rust 核心（NDK 交叉编译，先于 Kotlin） =================

      - name: 安装 Rust stable + Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # 依赖编译缓存（iroh/libsignal 体积大，三个 ABI 冷编译约 30+ 分钟）
      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk

      - name: 安装 protoc（libsignal 后量子棘轮的 protobuf 代码生成需要）
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: 定位预装 Android NDK
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK_ROOT="${ANDROID_NDK_ROOT:-}"
            if [ -z "$NDK_ROOT" ]; then
              NDK_ROOT="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | head -1)"
            fi
            echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
            echo "使用 NDK: $NDK_ROOT"
          else
            echo "使用预装 NDK: $ANDROID_NDK_HOME"
          fi

      # third_party/ 不入库（.gitignore），CI 上按本地同布局补齐：
      # - libsignal：fetch-by-SHA 浅抓取（全量 clone 数百 MB，会被限速拖死）
      # - iroh / iroh-relay：crates.io 发布包展开成 [patch.crates-io] 指向的目录；
      #   发布包字段已内联（无工作区继承），展开即用。Linux 交叉编译 Android 为
      #   ELF，无 windows-gnu 的 PE 导出表 65535 上限问题，无需本地那套清单改动。
      - name: 补齐 vendored 依赖（third_party）
        run: |
          mkdir -p third_party/libsignal
          git init -q third_party/libsignal
          git -C third_party/libsignal remote add origin https://github.com/signalapp/libsignal
          git -C third_party/libsignal fetch -q --depth 1 origin "$LIBSIGNAL_REV"
          git -C third_party/libsignal checkout -q --detach FETCH_HEAD

          mkdir -p third_party/iroh third_party/iroh-relay
          curl -fsSL "https://static.crates.io/crates/iroh/iroh-${IROH_VERSION}.crate" \
            | tar xz -C third_party/iroh --strip-components=1
          curl -fsSL "https://static.crates.io/crates/iroh-relay/iroh-relay-${IROH_VERSION}.crate" \
            | tar xz -C third_party/iroh-relay --strip-components=1

      # 交叉编译 Rust 核心到三个 ABI，libdc_core.so 输出到 jniLibs。
      # 仓库 .cargo/config.toml 的 [env] OPENSSL_DIR 指向本机 MSYS2（Linux 上不
      # 存在），libsqlite3-sys 构建脚本会在进入 vendored 分支前因 include 目录
      # 不存在而 panic；这里改指到空目录满足存在性检查，真实头文件与链接由
      # vendored-openssl 特性（openssl-src，用 cargo-ndk 注入的 NDK 工具链）提供。
      - name: cargo-ndk 交叉编译 Rust 核心
        env:
          # 覆盖配置里的 Windows 专用 OPENSSL_DIR（真实环境变量优先于 config [env]）
          OPENSSL_DIR: /tmp/openssl-dummy
        run: |
          mkdir -p /tmp/openssl-dummy/include /tmp/openssl-dummy/lib
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --lib -p dc-core --features vendored-openssl,ffi

      - name: Rust 核心测试
        env:
          OPENSSL_DIR: /tmp/openssl-dummy
        run: |
          mkdir -p /tmp/openssl-dummy/include /tmp/openssl-dummy/lib
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
          cargo test --lib -p dc-core --features vendored-openssl

      # 此前 CI 只跑 --lib，tests/ 下的集成测试（redteam 20 例 /
      # security_bruteforce 1 例 / iroh_pair 1 例）从未被执行过。三份测试
      # 均为进程内确定性测试（iroh_pair 已禁 relay 走 loopback），不依赖外网。
      - name: Rust 集成测试（tests/ 全量）
        env:
          OPENSSL_DIR: /tmp/openssl-dummy
        run: |
          mkdir -p /tmp/openssl-dummy/include /tmp/openssl-dummy/lib
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
          cargo test --tests -p dc-core --features vendored-openssl

      # ================= UniFFI Kotlin 绑定 =================
      # uniffi-bindgen 的 --library 模式靠 dlopen 读取 cdylib 里嵌入的元数据，
      # 必须是 host 架构（x86_64-linux）的 .so，不能用上面 cargo-ndk 产出的
      # Android ARM .so。生成物写入 android/app/src/main/uniffi，由
      # build.gradle.kts 的 sourceSets 纳入 Kotlin 编译（本目录不入库，
      # 每次构建重新生成，保证与 ffi.rs 接口同步）。
      - name: 构建 host cdylib + 生成 UniFFI Kotlin 绑定
        env:
          OPENSSL_DIR: /tmp/openssl-dummy
        run: |
          mkdir -p /tmp/openssl-dummy/include /tmp/openssl-dummy/lib
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
          cargo build --release --lib -p dc-core --features vendored-openssl,ffi
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
          cargo run --release -p dc-core --features vendored-openssl,ffi \
            --bin uniffi-bindgen -- generate \
            --library target/release/libdc_core.so \
            --config crates/core/uniffi.toml \
            --language kotlin \
            --out-dir android/app/src/main/uniffi

      # ================= Kotlin / APK =================

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 构建 APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # 此前 CI 只 assembleDebug，Kotlin 单测（FrameCollector / BleFrame /
      # FriendLink / NearbyDiscovery / MainScaffold 等）只被编译从未被执行。
      # Robolectric 镜像已在 build.gradle.kts 指到国内源，CI 上走 aliyun 亦可。
      - name: Kotlin 单元测试
        run: cd android && ./gradlew testDebugUnitTest --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
