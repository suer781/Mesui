[workspace]
resolver = "2"
members = ["crates/core"]
exclude = ["third_party"]

# iroh 1.1 官方 crate-type 含 "cdylib"，在 windows-gnu 下触发 PE 导出表
# 65535 上限。本项目只需 rlib，vendored 去掉 cdylib 后经 patch 接入。
# CI 上 Linux 交叉编译 Android 无此问题（ELF），但 patch 对所有目标生效。
[patch.crates-io]
iroh = { path = "third_party/iroh" }
iroh-relay = { path = "third_party/iroh-relay" }
