[package]
name = "dc-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "去中心化聊天核心：身份 / 熵源 / CBOR 信封 / 自适应策略 / 加密队列 / 传输"

[lib]
# cdylib：cargo-ndk 产出 libdc_core.so 放入 Android jniLibs；
# lib：保留 rlib 供本仓测试 / 示例 / 集成测试链接
crate-type = ["cdylib", "lib"]

# 功能分层：默认全开；--no-default-features 可只验证纯逻辑层
[features]
default = ["db", "compress", "signal", "iroh-net"]
db = ["dep:rusqlite"]                    # SQLCipher 加密本地库
compress = ["dep:zstd"]                  # 中/重载档批量压缩
signal = ["dep:libsignal-protocol"]      # Signal 官方 monorepo（git 依赖）
iroh-net = ["dep:iroh"]                  # P2P 管道（QUIC 打洞 + 中继）
ffi = ["dep:uniffi"]                     # UniFFI Kotlin 绑定（Android 集成时开）
# 交叉编译 Android 等无系统 OpenSSL 的目标时用：SQLCipher 的 C 编译需要
# OpenSSL 头文件，改由 openssl-src 从源码 vendor（走 cargo-ndk 注入的 NDK
# 工具链）。本机 windows-gnu 仍走 OPENSSL_DIR 指向的 MSYS2 libcrypto。
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.3"
rusqlite = { version = "0.32", optional = true, features = ["bundled-sqlcipher"] }
zstd = { version = "0.13", optional = true }
# signalapp/libsignal 官方 monorepo。vendored 在 C:/Users/13682/mesui-vendor/
# （fetch-by-SHA 至 eb7864c4d15435ee33681ce828930d9a4296f155，HEAD 哈希即信任锚）；
# CI 上由 workflow 浅抓取同 SHA 到工作区内 third_party/ 路径（build.yml 处理）。
# 本地路径由 .cargo/config.toml 无法覆盖，改用绝对路径（单机开发可接受）。
libsignal-protocol = { path = "C:/Users/13682/mesui-vendor/libsignal/rust/protocol", optional = true }
iroh = { version = "1", optional = true }
uniffi = { version = "0.29", optional = true, features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
